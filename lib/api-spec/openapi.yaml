openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Műtéti előjegyzési rendszer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Beteg műveletek
  - name: surgeries
    description: Műtéti előjegyzések
  - name: operating-rooms
    description: Műtőterem műveletek
  - name: surgeons
    description: Sebész műveletek
  - name: dashboard
    description: Dashboard összesítők

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: Betegek listázása
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, scheduled, operated, cancelled]
        - name: patientType
          in: query
          schema:
            type: string
        - name: admissionDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Betegek listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Új beteg felvitele
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Beteg létrehozva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Beteg adatai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Beteg adatai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Beteg nem található
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Beteg módosítása
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Beteg frissítve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Beteg nem található
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Beteg törlése
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Törölve
        "404":
          description: Beteg nem található

  /operating-rooms:
    get:
      operationId: listOperatingRooms
      tags: [operating-rooms]
      summary: Műtőtermek listázása
      responses:
        "200":
          description: Műtőtermek listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatingRoom"

  /surgeons:
    get:
      operationId: listSurgeons
      tags: [surgeons]
      summary: Sebészek listázása
      responses:
        "200":
          description: Sebészek listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surgeon"

  /surgeries:
    get:
      operationId: listSurgeries
      tags: [surgeries]
      summary: Műtéti előjegyzések listázása
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: operatingRoomId
          in: query
          schema:
            type: integer
        - name: surgeonId
          in: query
          schema:
            type: integer
        - name: patientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled]
      responses:
        "200":
          description: Műtétek listája
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surgery"
    post:
      operationId: createSurgery
      tags: [surgeries]
      summary: Új műtéti előjegyzés
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurgeryInput"
      responses:
        "201":
          description: Előjegyzés létrehozva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"

  /surgeries/{id}:
    get:
      operationId: getSurgery
      tags: [surgeries]
      summary: Műtét adatai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Műtét adatai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"
        "404":
          description: Műtét nem található
    patch:
      operationId: updateSurgery
      tags: [surgeries]
      summary: Műtét módosítása
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurgeryUpdate"
      responses:
        "200":
          description: Műtét frissítve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Surgery"
        "404":
          description: Műtét nem található
    delete:
      operationId: deleteSurgery
      tags: [surgeries]
      summary: Előjegyzés törlése
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Törölve
        "404":
          description: Műtét nem található

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Dashboard statisztikák
      responses:
        "200":
          description: Összesített statisztikák
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/calendar:
    get:
      operationId: getCalendarSurgeries
      tags: [dashboard]
      summary: Műtéti naptár nézet
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Műtétek a megadott időszakban
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surgery"

  /dashboard/admission-calendar:
    get:
      operationId: getAdmissionCalendar
      tags: [dashboard]
      summary: Felvételi naptár nézet
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Betegek felvételi adatai a megadott időszakban
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"

  /dashboard/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Legutóbbi előjegyzések és változások
      responses:
        "200":
          description: Legutóbbi aktivitás
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Surgery"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Patient:
      type: object
      required: [id, lastName, firstName, birthDate, status, createdAt]
      properties:
        id:
          type: integer
        lastName:
          type: string
        firstName:
          type: string
        birthDate:
          type: string
          format: date
        taj:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        diagnosis:
          type: ["string", "null"]
        status:
          type: string
          enum: [waiting, scheduled, operated, cancelled]
        patientType:
          type: ["string", "null"]
          description: "Beteg típusa: T=Tervezett, J=Járóbeteg, S=Sürgős"
        admissionDate:
          type: ["string", "null"]
          description: "Tervezett felvételi dátum (YYYY-MM-DD)"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PatientInput:
      type: object
      required: [lastName, firstName, birthDate]
      properties:
        lastName:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        birthDate:
          type: string
          format: date
        taj:
          type: string
        phone:
          type: string
        notes:
          type: string
        diagnosis:
          type: string
        status:
          type: string
          enum: [waiting, scheduled, operated, cancelled]
        patientType:
          type: string
          description: "T, J, vagy S"
        admissionDate:
          type: string
          description: "YYYY-MM-DD formátum"

    PatientUpdate:
      type: object
      properties:
        lastName:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        birthDate:
          type: string
          format: date
        taj:
          type: string
        phone:
          type: string
        notes:
          type: string
        diagnosis:
          type: string
        status:
          type: string
          enum: [waiting, scheduled, operated, cancelled]
        patientType:
          type: string
        admissionDate:
          type: string

    OperatingRoom:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
          description: "Műtőterem kódja (5, 6, 7, 8, A)"
        description:
          type: ["string", "null"]
        isActive:
          type: boolean

    OperatingRoomInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        description:
          type: string
        isActive:
          type: boolean

    Surgeon:
      type: object
      required: [id, lastName, firstName]
      properties:
        id:
          type: integer
        lastName:
          type: string
        firstName:
          type: string
        specialty:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean

    SurgeonInput:
      type: object
      required: [lastName, firstName]
      properties:
        lastName:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        specialty:
          type: string
        phone:
          type: string
        isActive:
          type: boolean

    Surgery:
      type: object
      required: [id, patientId, operatingRoomId, surgeonId, scheduledDate, status, createdAt]
      properties:
        id:
          type: integer
        patientId:
          type: integer
        operatingRoomId:
          type: integer
        surgeonId:
          type: integer
        scheduledDate:
          type: string
          format: date-time
        estimatedDurationMinutes:
          type: ["integer", "null"]
        surgeryType:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]
        patient:
          $ref: "#/components/schemas/Patient"
        operatingRoom:
          $ref: "#/components/schemas/OperatingRoom"
        surgeon:
          $ref: "#/components/schemas/Surgeon"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SurgeryInput:
      type: object
      required: [patientId, operatingRoomId, surgeonId, scheduledDate]
      properties:
        patientId:
          type: integer
        operatingRoomId:
          type: integer
        surgeonId:
          type: integer
        scheduledDate:
          type: string
          format: date-time
        estimatedDurationMinutes:
          type: integer
        surgeryType:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]

    SurgeryUpdate:
      type: object
      properties:
        patientId:
          type: integer
        operatingRoomId:
          type: integer
        surgeonId:
          type: integer
        scheduledDate:
          type: string
          format: date-time
        estimatedDurationMinutes:
          type: integer
        surgeryType:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled]

    DashboardStats:
      type: object
      required: [totalPatients, waitingPatients, scheduledToday, completedThisMonth, totalSurgeries, activeSurgeons, activeRooms]
      properties:
        totalPatients:
          type: integer
        waitingPatients:
          type: integer
        scheduledToday:
          type: integer
        completedThisMonth:
          type: integer
        totalSurgeries:
          type: integer
        activeSurgeons:
          type: integer
        activeRooms:
          type: integer
