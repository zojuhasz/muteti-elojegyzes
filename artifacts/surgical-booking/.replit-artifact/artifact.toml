kind = "web"
previewPath = "/"
title = "Műtéti Előjegyzési Rendszer"
version = "1.0.0"
id = "artifacts/surgical-booking"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24385

[services.development]
run = "pnpm --filter @workspace/surgical-booking run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/surgical-booking", "run", "build" ]
publicDir = "artifacts/surgical-booking/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24385"
BASE_PATH = "/"
